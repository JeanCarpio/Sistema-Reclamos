<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Registro</title>
        <link rel="stylesheet" href="StyleRegistro.css"> 
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    </head>
    <body>
        <div class="formulario-registro">
        <h1>Registro de Usuario</h1>
        <form action="#" method="POST" id="form-registro">
            <div class="form-group">
                <label for="username"><strong>Nombres:</strong></label>
                <input type="text" id="username" name="username"  required>
            </div>
            <div class="form-group">
                <label for="lastname"><strong>Apellidos:</strong></label>
                <input type="text" id="lastname" name="lastname"  required>
            </div>
            <div class="form-group">
                <label for="password"><strong>Contraseña:</strong></label>
                <input type="password" id="password" name="password"  required>
            </div>

            <div class="form-group">    
                <label for="email"><strong>Correo Electrónico:</strong></label>
                <input type="email" id="email" name="email" placeholder="correoprueba@gmail.com" required>
            </div>

        <!--Boton de enviar-->
        <div class="form-registro">
            <input type="submit" value="Registrarse">
        </div>

        <div class="login">
            <p>
                Ya tienes una cuenta creada?
            </p>
            <a href="Login.html">Inicia Sesión</a>
        </div>
        
        <p class="txt-social">o registrarse con:</p>
        <div class="social-container">
                <a href="#" class="social-btn google-btn"><i class="fab fa-google"></i></a>
                <a href="#" class="social-btn facebook-btn"><i class="fab fa-facebook-f"></i></a>
        </div>



    </body>
</html>
